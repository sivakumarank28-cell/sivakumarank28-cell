<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
<title id="title">Kumaran Krishnamoorthi Automotive Lighting Engineering Profile</title>
<desc id="desc">Premium automotive lighting themed profile banner with a stylized headlamp assembly and engineering text.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#06111f"/>
    <stop offset=".48" stop-color="#0a2238"/>
    <stop offset="1" stop-color="#06101c"/>
  </linearGradient>
  <radialGradient id="glow" cx=".72" cy=".5" r=".48">
    <stop offset="0" stop-color="#9fe5ff" stop-opacity=".38"/>
    <stop offset=".42" stop-color="#4fb7e8" stop-opacity=".16"/>
    <stop offset="1" stop-color="#0a2238" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#d9f5ff" stop-opacity=".9"/>
    <stop offset=".32" stop-color="#62c9f4" stop-opacity=".5"/>
    <stop offset=".75" stop-color="#1a6f9e" stop-opacity=".2"/>
    <stop offset="1" stop-color="#071522" stop-opacity=".05"/>
  </linearGradient>
  <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#e8fbff" stop-opacity=".95"/>
    <stop offset=".55" stop-color="#8ddfff" stop-opacity=".5"/>
    <stop offset="1" stop-color="#8ddfff" stop-opacity="0"/>
  </linearGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="soft2"><feGaussianBlur stdDeviation="7"/></filter>
</defs>

<rect width="1600" height="500" fill="url(#bg)"/>
<rect width="1600" height="500" fill="url(#glow)"/>

<!-- subtle engineering grid -->
<g opacity=".12" stroke="#8edcff" stroke-width="1">
  <path d="M900 55H1530M900 105H1530M900 395H1530M900 445H1530"/>
  <path d="M980 35V465M1080 35V465M1180 35V465M1280 35V465M1380 35V465M1480 35V465"/>
</g>

<!-- headlamp glow -->
<ellipse cx="1260" cy="250" rx="330" ry="145" fill="#72d7ff" opacity=".18" filter="url(#soft)"/>
<path d="M930 270 C1030 135 1250 105 1490 175 C1410 205 1335 285 1180 345 C1070 385 975 355 930 270Z"
      fill="#071522" stroke="#82d9ff" stroke-width="4" opacity=".95"/>
<path d="M950 268 C1050 160 1240 135 1430 182 C1350 210 1295 270 1170 318 C1070 355 995 335 950 268Z"
      fill="url(#lens)" stroke="#c7f3ff" stroke-opacity=".7" stroke-width="2"/>

<!-- DRL signature -->
<path d="M980 248 C1080 170 1235 160 1395 192 C1310 210 1245 255 1160 285 C1080 313 1015 298 980 248Z"
      fill="none" stroke="#b9efff" stroke-width="13" stroke-linecap="round" opacity=".95" filter="url(#soft2)"/>
<path d="M980 248 C1080 170 1235 160 1395 192 C1310 210 1245 255 1160 285 C1080 313 1015 298 980 248Z"
      fill="none" stroke="#d9f8ff" stroke-width="4" stroke-linecap="round"/>

<!-- projector modules -->
<g>
  <circle cx="1130" cy="270" r="54" fill="#06101b" stroke="#79cce9" stroke-width="3"/>
  <circle cx="1130" cy="270" r="35" fill="#0b2638" stroke="#bcefff" stroke-opacity=".55" stroke-width="2"/>
  <circle cx="1130" cy="270" r="16" fill="#dffaff"/>
  <circle cx="1245" cy="245" r="47" fill="#06101b" stroke="#79cce9" stroke-width="3"/>
  <circle cx="1245" cy="245" r="30" fill="#0b2638" stroke="#bcefff" stroke-opacity=".55" stroke-width="2"/>
  <circle cx="1245" cy="245" r="13" fill="#e6fbff"/>
  <circle cx="1340" cy="222" r="38" fill="#06101b" stroke="#79cce9" stroke-width="3"/>
  <circle cx="1340" cy="222" r="24" fill="#0b2638" stroke="#bcefff" stroke-opacity=".55" stroke-width="2"/>
  <circle cx="1340" cy="222" r="10" fill="#e9fcff"/>
</g>

<!-- controlled light beam -->
<path d="M1160 270 L1515 230 L1515 315 L1160 292Z" fill="url(#beam)" opacity=".18"/>
<path d="M1270 245 L1515 205 L1515 245 L1270 255Z" fill="url(#beam)" opacity=".25"/>

<!-- CAD-style dimension marks -->
<g fill="none" stroke="#7dcce9" stroke-width="2" opacity=".45">
  <path d="M930 385H1490M930 377V393M1490 377V393"/>
  <path d="M900 135V365M892 135H908M892 365H908"/>
</g>
<g fill="#9bdcf5" font-family="Arial,sans-serif" font-size="12" opacity=".65">
  <text x="1160" y="410">LIGHTING SIGNATURE / OPTICAL MODULE</text>
  <text x="865" y="255" transform="rotate(-90 865 255)">ENGINEERING PROFILE</text>
</g>

<!-- profile typography -->
<text x="90" y="178" fill="#ffffff" font-family="Arial,sans-serif" font-size="52" font-weight="700" letter-spacing="1">KUMARAN KRISHNAMOORTHI</text>
<text x="94" y="238" fill="#9fe1fb" font-family="Arial,sans-serif" font-size="26" font-weight="600" letter-spacing=".8">AUTOMOTIVE LIGHTING R&amp;D • MECHANICAL DESIGN • PLM</text>
<text x="94" y="282" fill="#d3e2ec" font-family="Arial,sans-serif" font-size="20">CATIA V5/V6 • ENOVIA • TEAMCENTER • 3DEXPERIENCE</text>
<text x="94" y="340" fill="#7dcce9" font-family="Arial,sans-serif" font-size="16" letter-spacing="2">HEADLAMP • REAR LAMP • VEHICLE INTEGRATION • DFM</text>

<!-- bottom accent -->
<rect x="94" y="375" width="430" height="3" rx="2" fill="#79d4f7"/>
<rect x="94" y="375" width="105" height="3" rx="2" fill="#ffffff"/>
</svg>